---
name: Prova ISO in VM

on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run di build-disk con l'artefatto ISO"
        type: string
        required: true
      salta_disco_sbagliato:
        description: "Solo diagnosi: salta il controllo del disco sbagliato"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  prova-vm:
    name: Prova d'installazione in VM
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: iso
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: KVM e QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 ovmf socat
      - name: Installa e prova
        env:
          SALTA_DISCO_SBAGLIATO: ${{ inputs.salta_disco_sbagliato && '1' || '0' }}
        run: bash tests/vm/installa-e-prova.sh "$(find iso -name '*.iso' | head -1)"
      - name: Schermate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schermate-vm
          path: |
            vm-prova/*.ppm
            vm-prova/diagnosi.txt
          if-no-files-found: ignore
